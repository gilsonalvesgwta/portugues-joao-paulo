name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logica:
    name: Lógica do aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test

  banco:
    name: Banco de dados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Regras de acesso, reserva e pagamento
        run: ./supabase/tests/rodar.sh

  aplicativo:
    name: Aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Para publicar a imagem da VPS no registro de imagens do GitHub (só no ramo principal).
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pacotes
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then npm ci; else npm install; fi 2>&1 | tee saida/1-instalar.txt
      - name: Auditoria de segurança dos pacotes (só relatório)
        run: |
          { echo "== pacotes usados em produção =="; npm audit --omit=dev || true; echo; echo "== todos os pacotes =="; npm audit || true; } > saida/7-auditoria.txt 2>&1
      - name: Subir o Supabase de teste
        run: |
          FALHOU=""
          npm run supabase:subir > /tmp/supabase-subir.txt 2>&1 || FALHOU="sim"
          # O registro publicado não leva chaves nem senhas, mesmo sendo as de teste.
          { grep -v -i -E "key|secret|jwt|password|postgresql://" /tmp/supabase-subir.txt || true; } | tail -n 80 > saida/8-supabase.txt
          if [ -n "$FALHOU" ]; then echo "O Supabase de teste não subiu."; exit 1; fi
          npx supabase status -o env > /tmp/supabase.env 2>/dev/null || true
          { echo; echo "variáveis informadas pelo Supabase:"; cut -d= -f1 /tmp/supabase.env; } >> saida/8-supabase.txt
          valor() { grep -E "^$1=" /tmp/supabase.env | head -n 1 | cut -d= -f2- | tr -d '"'; }
          ENDERECO="$(valor API_URL)"
          PUBLICA="$(valor ANON_KEY)"
          SERVICO="$(valor SERVICE_ROLE_KEY)"
          if [ -z "$ENDERECO" ] || [ -z "$PUBLICA" ] || [ -z "$SERVICO" ]; then
            echo "Não encontrei API_URL, ANON_KEY ou SERVICE_ROLE_KEY na saída do Supabase." | tee -a saida/8-supabase.txt
            exit 1
          fi
          echo "::add-mask::$SERVICO"
          {
            echo "SITE_URL=http://127.0.0.1:3000"
            echo "BASE_URL=http://127.0.0.1:3000"
            echo "SUPABASE_URL=$ENDERECO"
            echo "SUPABASE_ANON_KEY=$PUBLICA"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICO"
            echo "EMAIL_DRIVER=arquivo"
            echo "EMAIL_PASTA=$GITHUB_WORKSPACE/caixa-de-saida"
            echo "CAIXA_DE_TESTE_URL=$(valor MAILPIT_URL)"
            echo "CAIXA_DE_TESTE_SMTP=54325"
          } >> "$GITHUB_ENV"
      - name: Compilar
        run: npm run build 2>&1 | tee saida/2-compilar.txt
      - name: Tipos
        run: npm run typecheck 2>&1 | tee saida/3-tipos.txt
      - name: Fotografar as telas
        run: |
          npx playwright install --with-deps chromium > saida/4-navegador.txt 2>&1
          npm start > saida/5-servidor.txt 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/entrar" > /dev/null; then break; fi
            sleep 1
          done
          npm run capturas 2>&1 | tee saida/6-capturas.txt
      - name: Acesso de ponta a ponta
        run: npm run e2e 2>&1 | tee saida/9-ponta-a-ponta.txt
      # A mesma imagem que vai para a VPS: construída sem nenhuma chave e testada de verdade,
      # com login pelo navegador, antes de ser publicada.
      - name: Construir a imagem da VPS
        run: docker build -t plataforma:teste . 2>&1 | tail -n 60 | tee saida/10-imagem.txt
      - name: Testar a imagem (login de ponta a ponta dentro do contêiner)
        run: |
          {
            docker run -d --name plataforma --network host -e PORT=3100 \
              -e SITE_URL=http://127.0.0.1:3100 -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY \
              -e EMAIL_DRIVER=arquivo -e EMAIL_PASTA=/tmp/caixa-de-saida plataforma:teste
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3100/api/saude > /dev/null; then break; fi
              sleep 1
            done
            echo "sinal de vida: $(curl -s http://127.0.0.1:3100/api/saude)"
            echo "usuário dentro do contêiner: $(docker exec plataforma whoami)"
            echo "tamanho da imagem: $(docker image inspect plataforma:teste --format '{{.Size}}') bytes"
            ACHADOS=$(docker run --rm --entrypoint sh plataforma:teste -c "grep -rlF -e \"$SUPABASE_SERVICE_ROLE_KEY\" -e \"$SUPABASE_ANON_KEY\" /app 2>/dev/null | wc -l")
            echo "arquivos da imagem com alguma chave dentro: $ACHADOS"
            test "$ACHADOS" = "0"
            test "$(docker exec plataforma whoami)" = "node"
            curl -sf http://127.0.0.1:3100/api/saude | grep -q '"ok":true'
            BASE_URL=http://127.0.0.1:3100 node --test e2e/acesso.test.mjs
            for i in $(seq 1 40); do
              ESTADO=$(docker inspect plataforma --format '{{.State.Health.Status}}')
              if [ "$ESTADO" = "healthy" ]; then break; fi
              sleep 2
            done
            echo "saúde segundo o Docker: $ESTADO"
            test "$ESTADO" = "healthy"
          } 2>&1 | tee -a saida/10-imagem.txt
      - name: Guardar o registro do contêiner
        if: always()
        run: |
          if docker inspect plataforma > /dev/null 2>&1; then
            { echo; echo "== registro do contêiner =="; docker logs plataforma 2>&1 | tail -n 40; } >> saida/10-imagem.txt
          fi
      - name: Publicar a imagem (só no ramo principal)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag plataforma:teste "$IMAGEM:latest"
          docker tag plataforma:teste "$IMAGEM:${GITHUB_SHA::12}"
          docker push "$IMAGEM:latest" 2>&1 | tail -n 3
          docker push "$IMAGEM:${GITHUB_SHA::12}" 2>&1 | tail -n 3
          echo "imagem publicada: $IMAGEM:latest e $IMAGEM:${GITHUB_SHA::12}" | tee -a saida/10-imagem.txt
      # As sessões do Claude não conseguem baixar os registros do GitHub Actions.
      # Esta etapa publica o fim de cada registro, as fotos das telas e o
      # package-lock.json no ramo "ci-saida", que é sobrescrito a cada execução.
      - name: Publicar a saída no ramo ci-saida
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMO: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then cp package-lock.json saida/; fi
          if [ -d capturas ]; then cp -r capturas saida/; fi
          for arquivo in saida/*.txt; do
            if [ -f "$arquivo" ]; then
              tail -n 300 "$arquivo" > "$arquivo.fim"
              mv "$arquivo.fim" "$arquivo"
            fi
          done
          echo "ramo: $RAMO | commit: $GITHUB_SHA | execucao: $GITHUB_RUN_ID" > saida/LEIA.txt
          cd saida
          git init -q -b ci-saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Saída dos testes de $RAMO ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-saida
