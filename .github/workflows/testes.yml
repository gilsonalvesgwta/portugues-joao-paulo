name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logica:
    name: Lógica do aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test

  banco:
    name: Banco de dados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Regras de acesso, reserva e pagamento
        run: ./supabase/tests/rodar.sh

  aplicativo:
    name: Aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      # Para publicar a imagem da VPS no registro de imagens do GitHub (só no ramo principal).
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pacotes
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then npm ci; else npm install; fi 2>&1 | tee saida/1-instalar.txt
      - name: Auditoria de segurança dos pacotes (só relatório)
        run: |
          { echo "== pacotes usados em produção =="; npm audit --omit=dev || true; echo; echo "== todos os pacotes =="; npm audit || true; } > saida/7-auditoria.txt 2>&1
      - name: Subir o Supabase de teste
        run: |
          FALHOU=""
          npm run supabase:subir > /tmp/supabase-subir.txt 2>&1 || FALHOU="sim"
          # O registro publicado não leva chaves nem senhas, mesmo sendo as de teste.
          { grep -v -i -E "key|secret|jwt|password|postgresql://" /tmp/supabase-subir.txt || true; } | tail -n 80 > saida/8-supabase.txt
          if [ -n "$FALHOU" ]; then echo "O Supabase de teste não subiu."; exit 1; fi
          npx supabase status -o env > /tmp/supabase.env 2>/dev/null || true
          { echo; echo "variáveis informadas pelo Supabase:"; cut -d= -f1 /tmp/supabase.env; } >> saida/8-supabase.txt
          valor() { grep -E "^$1=" /tmp/supabase.env | head -n 1 | cut -d= -f2- | tr -d '"'; }
          ENDERECO="$(valor API_URL)"
          PUBLICA="$(valor ANON_KEY)"
          SERVICO="$(valor SERVICE_ROLE_KEY)"
          if [ -z "$ENDERECO" ] || [ -z "$PUBLICA" ] || [ -z "$SERVICO" ]; then
            echo "Não encontrei API_URL, ANON_KEY ou SERVICE_ROLE_KEY na saída do Supabase." | tee -a saida/8-supabase.txt
            exit 1
          fi
          echo "::add-mask::$SERVICO"
          {
            echo "SITE_URL=http://127.0.0.1:3000"
            echo "BASE_URL=http://127.0.0.1:3000"
            echo "SUPABASE_URL=$ENDERECO"
            echo "SUPABASE_ANON_KEY=$PUBLICA"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICO"
            echo "EMAIL_DRIVER=arquivo"
            echo "EMAIL_PASTA=$GITHUB_WORKSPACE/caixa-de-saida"
            echo "CAIXA_DE_TESTE_URL=$(valor MAILPIT_URL)"
            echo "CAIXA_DE_TESTE_SMTP=54325"
            echo "ADMIN_EMAIL=dono@exemplo.test"
            echo "ADMIN_SENHA_INICIAL=senha-inicial-de-teste"
          } >> "$GITHUB_ENV"
      - name: Compilar
        run: npm run build 2>&1 | tee saida/2-compilar.txt
      - name: Tipos
        run: npm run typecheck 2>&1 | tee saida/3-tipos.txt
      - name: Fotografar as telas
        run: |
          npx playwright install --with-deps chromium > saida/4-navegador.txt 2>&1
          npm start > saida/5-servidor.txt 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/entrar" > /dev/null; then break; fi
            sleep 1
          done
          npm run capturas 2>&1 | tee saida/6-capturas.txt
      - name: Acesso de ponta a ponta
        run: npm run e2e 2>&1 | tee saida/9-ponta-a-ponta.txt
      # As mesmas imagens e o mesmo arquivo de stack que vão para a VPS: construídos sem nenhuma
      # chave e testados de verdade em Docker Swarm, com banco e login próprios, antes de publicar.
      - name: Construir as imagens da VPS
        run: |
          {
            docker build -t plataforma:teste . 2>&1 | tail -n 40
            docker build -f deploy/banco/Dockerfile -t banco:teste . 2>&1 | tail -n 20
            echo "usuário dentro da imagem do aplicativo: $(docker run --rm --entrypoint whoami plataforma:teste)"
            echo "tamanho da imagem do aplicativo: $(docker image inspect plataforma:teste --format '{{.Size}}') bytes"
            echo "tamanho da imagem do banco: $(docker image inspect banco:teste --format '{{.Size}}') bytes"
            ACHADOS=$(docker run --rm --entrypoint sh plataforma:teste -c "grep -rlF -e \"$SUPABASE_SERVICE_ROLE_KEY\" -e \"$SUPABASE_ANON_KEY\" /app 2>/dev/null | wc -l")
            echo "arquivos da imagem com alguma chave dentro: $ACHADOS"
            test "$ACHADOS" = "0"
            test "$(docker run --rm --entrypoint whoami plataforma:teste)" = "node"
          } 2>&1 | tee saida/10-imagem.txt
      # Segredos só deste teste, sorteados a cada execução. Ficam escondidos nos registros
      # e não entram em nenhum arquivo publicado.
      - name: Sortear os segredos do teste da stack
        run: |
          SENHA="$(openssl rand -hex 20)"
          SEGREDO="$(openssl rand -hex 32)"
          INICIAL="$(openssl rand -hex 8)"
          echo "::add-mask::$SENHA"
          echo "::add-mask::$SEGREDO"
          echo "::add-mask::$INICIAL"
          {
            echo "STACK_SENHA_DO_BANCO=$SENHA"
            echo "STACK_SEGREDO_JWT=$SEGREDO"
            echo "STACK_ADMIN_SENHA=$INICIAL"
            echo "STACK_PASTA_DA_CAIXA=$GITHUB_WORKSPACE/caixa-da-stack"
          } >> "$GITHUB_ENV"
      - name: Subir a stack da VPS em Docker Swarm
        run: |
          {
            docker swarm init --advertise-addr 127.0.0.1 > /dev/null
            docker network create --driver overlay --attachable Wtatechor3Net > /dev/null
            export DOMINIO=plataforma.exemplo.test
            export SENHA_DO_BANCO="$STACK_SENHA_DO_BANCO"
            export SEGREDO_JWT="$STACK_SEGREDO_JWT"
            export ADMIN_EMAIL=dono@exemplo.test
            export ADMIN_SENHA_INICIAL="$STACK_ADMIN_SENHA"
            export SMTP_USER=aulas@exemplo.test SMTP_PASS=nao-usada-no-teste
            export PASTA_DA_CAIXA="$STACK_PASTA_DA_CAIXA"
            mkdir -p "$PASTA_DA_CAIXA" && chmod 777 "$PASTA_DA_CAIXA"
            docker stack deploy --resolve-image never -c deploy/portainer-stack.yml -c deploy/teste-github.yml portuguesjp 2>&1 | grep -v -i "image .* could not be accessed" || true

            echo "esperando o preparo do banco..."
            PRONTO=""
            for i in $(seq 1 90); do
              if docker service logs portuguesjp_portuguesjp_banco 2>&1 | grep -q "BANCO PRONTO"; then PRONTO="sim"; break; fi
              sleep 4
            done
            docker service logs portuguesjp_portuguesjp_banco 2>&1 | sed -E 's/^[^|]*\| //' | tail -n 25
            test -n "$PRONTO"

            # Login e dados reiniciam sozinhos até o banco aceitar a senha deles; os testes só
            # começam depois de os três responderem várias vezes seguidas.
            echo "esperando o aplicativo, o login e os dados..."
            SEGUIDAS=0
            for i in $(seq 1 90); do
              APP=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/api/saude || true)
              LOGIN=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9999/health || true)
              DADOS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ || true)
              if [ "$APP" = "200" ] && [ "$LOGIN" = "200" ] && [ "$DADOS" = "200" ]; then SEGUIDAS=$((SEGUIDAS + 1)); else SEGUIDAS=0; fi
              if [ "$SEGUIDAS" -ge 4 ]; then break; fi
              sleep 2
            done
            echo "respostas: aplicativo $APP, login $LOGIN, dados $DADOS"
            test "$SEGUIDAS" -ge 4
            echo "sinal de vida: $(curl -s http://127.0.0.1:3200/api/saude)"
            curl -sf http://127.0.0.1:3200/api/saude | grep -q '"ok":true'
            docker service ls --format 'serviço {{.Name}}: {{.Replicas}}'
          } 2>&1 | tee saida/11-stack.txt
      - name: Ponta a ponta contra a stack da VPS
        run: |
          # Os testes passam a falar com o login e os dados da stack, do mesmo jeito que o aplicativo.
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            BASE_URL=http://127.0.0.1:3200 \
            SUPABASE_AUTH_URL=http://127.0.0.1:9999 SUPABASE_REST_URL=http://127.0.0.1:3001 \
            SUPABASE_JWT_SECRET="$STACK_SEGREDO_JWT" \
            ADMIN_EMAIL=dono@exemplo.test ADMIN_SENHA_INICIAL="$STACK_ADMIN_SENHA" \
            EMAIL_PASTA="$STACK_PASTA_DA_CAIXA" \
            npm run e2e 2>&1 | tee saida/12-ponta-a-ponta-na-stack.txt
      - name: Medir a stack e guardar os registros
        if: always()
        run: |
          if docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null | grep -q '^active$'; then
            {
              echo
              echo "== memória e saúde de cada contêiner, depois dos testes =="
              docker stats --no-stream --format '{{.Name}}: {{.MemUsage}}' | sed -E 's/\.[0-9]+\.[a-z0-9]+:/:/' | grep portuguesjp || true
              docker ps --filter name=portuguesjp --format '{{.Names}}: {{.Status}}' | sed -E 's/\.[0-9]+\.[a-z0-9]+:/:/'
              for servico in app auth rest db banco; do
                echo
                echo "== registro de portuguesjp_$servico =="
                docker service logs "portuguesjp_portuguesjp_$servico" 2>&1 | sed -E 's/^[^|]*\| //' | grep -v -i -E "password|secret|jwt|postgres://|$STACK_SENHA_DO_BANCO|$STACK_SEGREDO_JWT" | tail -n 12 | cut -c1-400
              done
            } >> saida/11-stack.txt 2>&1
          fi
      - name: Publicar as imagens (só no ramo principal)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publicar() { # imagem local, nome no registro
            docker tag "$1" "$2:latest"
            docker tag "$1" "$2:${GITHUB_SHA::12}"
            docker push "$2:latest" 2>&1 | tail -n 2
            docker push "$2:${GITHUB_SHA::12}" 2>&1 | tail -n 2
            echo "imagem publicada: $2:latest e $2:${GITHUB_SHA::12}" | tee -a saida/10-imagem.txt
          }
          publicar plataforma:teste "ghcr.io/${GITHUB_REPOSITORY,,}"
          publicar banco:teste "ghcr.io/${GITHUB_REPOSITORY,,}-banco"
      # As sessões do Claude não conseguem baixar os registros do GitHub Actions.
      # Esta etapa publica o fim de cada registro, as fotos das telas e o
      # package-lock.json no ramo "ci-saida", que é sobrescrito a cada execução.
      - name: Publicar a saída no ramo ci-saida
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMO: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then cp package-lock.json saida/; fi
          if [ -d capturas ]; then cp -r capturas saida/; fi
          for arquivo in saida/*.txt; do
            if [ -f "$arquivo" ]; then
              tail -n 300 "$arquivo" > "$arquivo.fim"
              mv "$arquivo.fim" "$arquivo"
            fi
          done
          echo "ramo: $RAMO | commit: $GITHUB_SHA | execucao: $GITHUB_RUN_ID" > saida/LEIA.txt
          cd saida
          git init -q -b ci-saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Saída dos testes de $RAMO ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-saida
