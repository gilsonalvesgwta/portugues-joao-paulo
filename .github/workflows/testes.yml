name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logica:
    name: Lógica do aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test

  banco:
    name: Banco de dados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Regras de acesso, reserva e pagamento
        run: ./supabase/tests/rodar.sh

  aplicativo:
    name: Aplicativo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pacotes
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then npm ci; else npm install; fi 2>&1 | tee saida/1-instalar.txt
      - name: Auditoria de segurança dos pacotes (só relatório)
        run: |
          { echo "== pacotes usados em produção =="; npm audit --omit=dev || true; echo; echo "== todos os pacotes =="; npm audit || true; } > saida/7-auditoria.txt 2>&1
      - name: Subir o Supabase de teste
        run: |
          FALHOU=""
          npm run supabase:subir > /tmp/supabase-subir.txt 2>&1 || FALHOU="sim"
          # O registro publicado não leva chaves nem senhas, mesmo sendo as de teste.
          { grep -v -i -E "key|secret|jwt|password|postgresql://" /tmp/supabase-subir.txt || true; } | tail -n 80 > saida/8-supabase.txt
          if [ -n "$FALHOU" ]; then echo "O Supabase de teste não subiu."; exit 1; fi
          npx supabase status -o env > /tmp/supabase.env 2>/dev/null || true
          { echo; echo "variáveis informadas pelo Supabase:"; cut -d= -f1 /tmp/supabase.env; } >> saida/8-supabase.txt
          valor() { grep -E "^$1=" /tmp/supabase.env | head -n 1 | cut -d= -f2- | tr -d '"'; }
          ENDERECO="$(valor API_URL)"
          PUBLICA="$(valor ANON_KEY)"
          SERVICO="$(valor SERVICE_ROLE_KEY)"
          if [ -z "$ENDERECO" ] || [ -z "$PUBLICA" ] || [ -z "$SERVICO" ]; then
            echo "Não encontrei API_URL, ANON_KEY ou SERVICE_ROLE_KEY na saída do Supabase." | tee -a saida/8-supabase.txt
            exit 1
          fi
          echo "::add-mask::$SERVICO"
          {
            echo "SITE_URL=http://127.0.0.1:3000"
            echo "BASE_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$ENDERECO"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLICA"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICO"
          } >> "$GITHUB_ENV"
      - name: Compilar
        run: npm run build 2>&1 | tee saida/2-compilar.txt
      - name: Tipos
        run: npm run typecheck 2>&1 | tee saida/3-tipos.txt
      - name: Fotografar as telas
        run: |
          npx playwright install --with-deps chromium > saida/4-navegador.txt 2>&1
          npm start > saida/5-servidor.txt 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/entrar" > /dev/null; then break; fi
            sleep 1
          done
          npm run capturas 2>&1 | tee saida/6-capturas.txt
      - name: Acesso de ponta a ponta
        run: npm run e2e 2>&1 | tee saida/9-ponta-a-ponta.txt
      # As sessões do Claude não conseguem baixar os registros do GitHub Actions.
      # Esta etapa publica o fim de cada registro, as fotos das telas e o
      # package-lock.json no ramo "ci-saida", que é sobrescrito a cada execução.
      - name: Publicar a saída no ramo ci-saida
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMO: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p saida
          if [ -f package-lock.json ]; then cp package-lock.json saida/; fi
          if [ -d capturas ]; then cp -r capturas saida/; fi
          for arquivo in saida/*.txt; do
            if [ -f "$arquivo" ]; then
              tail -n 300 "$arquivo" > "$arquivo.fim"
              mv "$arquivo.fim" "$arquivo"
            fi
          done
          echo "ramo: $RAMO | commit: $GITHUB_SHA | execucao: $GITHUB_RUN_ID" > saida/LEIA.txt
          cd saida
          git init -q -b ci-saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Saída dos testes de $RAMO ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-saida
